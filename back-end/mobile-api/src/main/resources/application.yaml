server:
  port: ${PORT:8080}

spring:
  application:
    name: mobile-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Configuração da API de e-mails transacionais (Brevo)
brevo:
  api-key: ${BREVO_API_KEY:}
  sender:
    email: ${BREVO_SENDER_EMAIL:digo22nt@gmail.com}
    name: ${BREVO_SENDER_NAME:Agenda Rosa}
