server:
  port: ${PORT:8080}

spring:
  application:
    name: mobile-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  rabbitmq:
    addresses: ${RABBITMQ_URL:}
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false

# Configuração da API de e-mails transacionais (Brevo)
brevo:
  api-key: ${BREVO_API_KEY:}
  sender:
    email: ${BREVO_SENDER_EMAIL:digo22nt@gmail.com}
    name: ${BREVO_SENDER_NAME:Agenda Rosa}

# Configuração do Mercado Pago
mercadopago:
  access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
  notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:https://agenda-rosa-mobile-workspace.onrender.com/api/v1/pagamentos/webhook}

# Configuração do Google Gemini (Assistente Rosa IA - SCRUM-29)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.8-flash}

