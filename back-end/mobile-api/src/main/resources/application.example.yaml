# ==============================================================================
# ARQUIVO DE REFERÊNCIA / EXEMPLO - AGENDA ROSA MOBILE API
# ==============================================================================
# Use este modelo para entender as variáveis de ambiente que o sistema precisa
# para conectar com o PostgreSQL (Neon), enviar e-mails via Brevo e iniciar o servidor.
# ==============================================================================

server:
  # O Render injeta a variável PORT dinamicamente (geralmente 10000).
  # Localmente, caso não informada, assumirá a porta 8080.
  port: ${PORT:8080}

spring:
  application:
    name: mobile-api

  datasource:
    # URL de conexão JDBC com o Neon Database
    # Exemplo: jdbc:postgresql://ep-xyz-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require
    url: ${DB_URL}

    # Usuário do banco de dados (ex: neondb_owner)
    username: ${DB_USERNAME}

    # Senha do banco de dados (armazenada de forma segura nas variáveis de ambiente)
    password: ${DB_PASSWORD}

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'validate' garante que o Hibernate valide o schema existente no Neon sem alterar tabelas
      ddl-auto: validate
    open-in-view: false

# Configuração da API de e-mails transacionais (Brevo)
brevo:
  # Chave gerada na Brevo em "SMTP e API" -> "Chaves de API" (começa com xkeysib-...)
  api-key: ${BREVO_API_KEY:}
  sender:
    # E-mail com status Verificado na sua conta da Brevo
    email: ${BREVO_SENDER_EMAIL:digo22nt@gmail.com}
    name: ${BREVO_SENDER_NAME:Agenda Rosa}
